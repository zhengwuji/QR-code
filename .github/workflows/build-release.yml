name: 自动编译并发布 APK (Build & Release)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译 APK 并发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 下载编译与签名工具 (Apktool & uber-apk-signer)
        run: |
          mkdir -p tools-bin dist
          curl -sSL -o tools-bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sSL -o tools-bin/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: 编译 APK
        run: |
          echo "=== 正在编译修复版 APK ==="
          java -jar tools-bin/apktool.jar b app -o build_raw.apk --use-aapt2
          java -jar tools-bin/uber-apk-signer.jar -a build_raw.apk -o out --allowResign
          mv out/*-aligned-debugSigned.apk "dist/QRScanner_2.7.6_Fixed_Deobf.apk"
          rm -rf build_raw.apk out

      - name: 生成 SHA256 校验和
        run: |
          cd dist
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: 生成发布标签
        id: release_meta
        run: |
          TAG_NAME="v2.7.6-r${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          DATE_STR=$(date -u +"%Y-%m-%d %H:%M:%S")
          echo "release_date=$DATE_STR" >> $GITHUB_OUTPUT

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: 二维码扫描器 2.7.6 修复版 (${{ steps.release_meta.outputs.tag_name }})
          draft: false
          prerelease: false
          files: |
            dist/QRScanner_2.7.6_Fixed_Deobf.apk
            dist/sha256sums.txt
          body: |
            ## 二维码扫描器 2.7.6 修复版

            > **构建版本**：`${{ steps.release_meta.outputs.tag_name }}`
            > **触发提交**：`${{ github.sha }}`
            > **构建时间**：${{ steps.release_meta.outputs.release_date }} (UTC)

            ### 修复与优化
            1. 修复扫一扫真实二维码闪退（VerifyUtils 自杀校验链 / 环境检测 / SDK killProcess 中和）
            2. 修复图库扫码读不到 Photo Picker `content://` URI 的问题
            3. 移除全部广告与评分弹窗代码（39 个方法桩体化 + UI 隐藏 + 服务端开关）
            4. 去混淆维护版：4281 个类按 `.source` 注释还原语义命名，251 个含 R8 保留类的包回退原名保证 package-private 访问合法
            5. 移除结果页广告加载骨架（常驻加载动画）
